name: logichome
description: "SaaS Control Panel para Condomínios - Logic Home"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.31.18
  permission_handler: ^11.3.0
  file_picker: ^8.0.0
  
  # Firebase Core e Auth
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  cloud_functions: ^6.1.0
  firebase_storage: ^13.2.0
  firebase_app_check: ^0.4.2
  
  # --- INÍCIO PUSH NOTIFICATION ---
  firebase_messaging: 16.1.3
  flutter_local_notifications: ^18.0.1
  # --- FIM PUSH NOTIFICATION ---

  # Infraestrutura e Segurança
  http: ^1.2.0
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^10.0.0
  encrypt: ^5.0.3

  # Motores de Vídeo, Hardware e OCR (Urna da Portaria)
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.1
  camera: ^0.10.5+9         
  camera_windows: ^0.2.1+9  
  camera_web: ^0.3.2+2      
  shared_preferences: ^2.2.2
  image: ^4.1.7

  # Necessário para a Engenharia do Túnel Reverso no Windows
  path_provider: ^2.1.2
  universal_io: ^2.2.2
  window_manager: ^0.4.3

  # Utilidades
  intl: ^0.20.2
  uuid: ^4.5.3
  url_launcher: ^6.3.0
  share_plus: ^12.0.1
  screen_protector: ^1.5.1
  fl_chart: ^1.2.0

  # --- PACOTES DE PÂNICO SILENCIOSO E NOVOS (PDF/TTS) ---
  sensors_plus: ^6.1.0
  vibration: ^3.1.3
  tutorial_coach_mark: ^1.3.3
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_tts: ^4.2.5
  flutter_callkit_incoming: ^3.0.0
  flutter_background_service: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  msix: ^3.16.13
  flutter_launcher_icons: ^0.13.1 
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Ao deixar assim (com a barra / no final), o Flutter pega TODOS
    # os arquivos .mp3 e .png que estiverem lá dentro automaticamente!
    - assets/
    - assets/bin/

# CONFIGURAÇÃO DO GERADOR DE ÍCONES PARA O APP
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 256

# CONFIGURAÇÃO DO GERADOR DE INSTALADOR WINDOWS (MSIX)
msix_config:
  display_name: LogicHome
  publisher_display_name: Andre Luz
  publisher: CN=AndreLuz, O=LogicHome, C=BR
  identity_name: com.logichome.app
  msix_version: 1.0.0.5
  logo_path: assets/logo.png
  capabilities: internetClient, location, microphone, webcam, privateNetworkClientServer
  certificate_path: test_certificate.pfx
  certificate_password: password123
  